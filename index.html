<style>
:root{--bg:#f2f2f1;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--accent:#d99a0b;--border:#d9d9d4;--yellow:#f0b92b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#222;--text:#f1f1ee;--muted:#9a9a94;--accent:#f0b92b;--border:#3a3a38}}
:root[data-theme="dark"]{--bg:#141414;--card:#222;--text:#f1f1ee;--muted:#9a9a94;--accent:#f0b92b;--border:#3a3a38}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-gutter:stable;overflow-x:clip}
body{overflow-x:clip;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0}
.bar{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
#tools{flex:1;min-width:0;display:flex;align-items:center;gap:10px;margin:0 16px}
#tools>*{flex:none}
#tmid{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
#tmid>*{flex:none}
#tmid::-webkit-scrollbar{display:none}
.sep{width:1px;height:26px;background:var(--border);flex:none}
.right{display:flex;align-items:center;gap:20px;flex:none}
button#newbtn{border:2px solid var(--yellow);font-weight:800;padding:6px 16px;font-size:.78rem}
button#newbtn:hover{background:var(--yellow);color:#1d1d1b}
.addt{border:2px dashed var(--border)!important;background:transparent!important;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:1;align-self:start;text-align:center;padding:0!important;border-radius:10px;user-select:none}
.addt:hover,.addt.over,.addt:focus-visible{border-color:var(--accent)!important;color:var(--accent);outline:0}
.addt .plus{font-size:2.6rem;font-weight:500;line-height:1}
.addt small{font-size:.72rem;letter-spacing:.02em}
.sth.addt{border-radius:6px}
.sth.addt .plus{font-size:1.6rem}
.sth.addt small{font-size:.58rem}
#tools .btn,#tools select{padding:7px 13px;font-size:.78rem}
#tools .go{min-width:0;flex:none;padding:8px 16px;font-size:.8rem}
#split,#wordp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0 0}
#wordp select{font-size:.8rem;padding:8px 14px}
#split input,#wordp input{font:inherit;font-size:.85rem;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);flex:1;min-width:180px;max-width:320px}
#split .go,#wordp .go{padding:9px 16px;font-size:.8rem;min-width:0;flex:none}
#smsg,#wmsg{font-size:.8rem;color:var(--muted)}
.lp{position:relative}
.lp::before{content:"";position:absolute;left:calc(50% - .45em);top:50%;width:0;height:0;border-radius:50%;background:var(--yellow);transform:translate(-50%,-50%);z-index:-1}
body.has .lp{color:#1d1d1b}
body.has .lp::before{width:1.7em;height:1.7em}
@media (max-width:720px){body.has nav{display:none}}
.logo{font-weight:800;font-size:1.2rem;color:var(--text);text-decoration:none;position:relative;z-index:0;margin-left:1em}
nav{display:flex;gap:26px}
nav a{color:var(--text);text-decoration:none;font-size:.8rem;letter-spacing:.04em;font-weight:500;transition:color .3s}
nav a:hover,nav a.on{color:var(--accent)}
#libwarn,#errwarn{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0;padding:10px 14px;border:1px solid var(--accent);border-radius:12px;background:var(--card);font-size:.85rem;line-height:1.4}
#libwarn .btn,#errwarn .btn{padding:6px 14px;font-size:.78rem;flex:none}
#errwarn{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);z-index:30}
#errtxt{white-space:pre-line;overflow-wrap:anywhere}
#ld,#er{display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#drop.ld #ld,#drop.er #er{display:flex}
#drop.ld #add,#drop.er #add{display:none}
#ld{gap:4px}
#ld svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#ld circle{fill:none;stroke-width:4.5}
#ld .trk{stroke:#fff1c2}
#ld .arc{stroke:url(#ldstr);stroke-linecap:butt}
#ldp{position:relative;font-size:clamp(1.3rem,5vw,1.9rem);font-weight:800;line-height:1}
#ldt{position:relative;font-size:.85rem;opacity:.75;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#er{gap:10px;text-align:center;padding:0 24% 0 10%}
@media (max-width:720px){#er{padding:0 12%}}
#ert{font-weight:800;font-size:clamp(1.3rem,5vw,1.9rem);line-height:1.1}
#erl{font-size:.85rem;opacity:.8;white-space:pre-line;overflow-wrap:anywhere;line-height:1.4}
.addt .mini{width:34px;height:34px}
.addt .mini circle{fill:none;stroke:currentColor;stroke-width:3}
.addt .mini .trk{opacity:.2}
.addt .mini .arc{stroke-linecap:round}
#hero{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 140px);padding:10px 0 30px}
#drop{width:min(80vw,430px);aspect-ratio:1;border-radius:50%;background:var(--yellow);color:#1d1d1b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;flex:none;transition:background .15s}
#drop.over{background:#f5c64a}
#drop{position:relative}
#sil{display:none;position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
body.abt #sil{display:block}
.opt{font-weight:800;font-size:1.5rem;color:#1d1d1b;cursor:default;user-select:none}
#drop.pick{cursor:pointer}
#drop.pick:hover{background:#f5c64a}
.plus{font-size:5rem;font-weight:500;line-height:1;text-align:center}
.bigc>span{display:block}
#add small{display:block;text-align:center;font-size:.85rem;opacity:.75;margin-top:6px}

#big{margin:0 0 0 -75px;font-size:clamp(2.6rem,7vw,5.4rem);font-weight:800;line-height:.95;letter-spacing:-.02em;position:relative;pointer-events:none}
#big span{display:block}
#aboutv{max-width:560px;margin:70px auto;font-size:1.05rem;line-height:1.7}
#aboutv h2{font-size:2.4rem;margin:0 0 12px;font-weight:800}
#work{padding:10px 0 50px}
#list{list-style:none;padding:0;margin:16px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
li{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px}
li,.sth{transition:transform .15s,box-shadow .15s}
li.drag,.sth.drag{opacity:.85;border-color:var(--accent);transform:scale(1.06);box-shadow:0 10px 24px rgba(0,0,0,.3);position:relative;z-index:5}
.top,.bot{display:flex;align-items:center;justify-content:space-between}
.pg{color:var(--accent);font-weight:800;font-size:.9rem;padding-left:4px}
.grip{cursor:grab;touch-action:none;user-select:none;color:var(--muted);padding:4px 8px;font-size:1.1rem}
.box{height:120px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg);border-radius:6px}
.box img{max-width:100%;max-height:100%;transition:transform .15s;pointer-events:none}
.box .blank{width:84px;height:118px;background:#fff;border:1px solid var(--border)}
#list.doc{grid-template-columns:minmax(0,640px);justify-content:center;gap:22px}
#list.doc .box{height:auto;aspect-ratio:210/297;background:#fff;color:#555;box-shadow:0 2px 14px rgba(0,0,0,.2);border-radius:2px}
#list.doc .box img{width:100%;height:100%;max-width:none;max-height:none;object-fit:contain}
.tag{font-size:.7rem;color:var(--muted);padding-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li button{background:none;border:0;color:var(--muted);font-size:1.25rem;cursor:pointer;padding:2px 8px}
li button:hover{color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,button.btn{font:inherit;font-size:.85rem;padding:10px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
button.go{font:inherit;font-weight:800;padding:12px 18px;border-radius:999px;background:var(--yellow);color:#1d1d1b;border:0;cursor:pointer;flex:1;min-width:160px;position:relative;overflow:hidden;isolation:isolate}
button.go.busy{background:#fff1c2}
button.go.busy::before{content:"";position:absolute;inset:0;width:calc(var(--f,0)*100%);background-color:var(--yellow);background-image:linear-gradient(45deg,#fff 25%,transparent 25%,transparent 50%,#fff 50%,#fff 75%,transparent 75%);background-size:28px 28px;transition:width .35s ease;animation:gostripes .7s linear infinite;z-index:-1}
@keyframes gostripes{to{background-position:28px 0}}
@media (prefers-reduced-motion:reduce){button.go.busy::before{transition:none;animation:none}}
button:disabled{opacity:.4;cursor:default}
#msg{color:var(--muted);font-size:.9rem;margin-top:10px}
@media (max-width:720px){#hero{flex-direction:column;min-height:0;padding-top:20px}#big{margin:22px 0 0;text-align:center}nav{gap:16px}}
#side{display:none}
#work.docmode{display:grid;grid-template-columns:156px minmax(0,1fr);gap:20px;align-items:start}
#work.docmode #msg{grid-column:1/-1}
#work.docmode #side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);max-height:calc(100vh - 96px);overflow-y:auto;margin:16px 0;padding:2px;scrollbar-width:thin;align-content:start}
.sth{position:relative;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:3px;cursor:pointer}
.sth.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stb{aspect-ratio:210/297;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:2px}
.stb img{max-width:100%;max-height:100%;pointer-events:none}
.sth .n{position:absolute;left:5px;bottom:4px;font-size:.62rem;font-weight:800;color:#1d1d1b;background:rgba(255,255,255,.85);border-radius:4px;padding:0 4px}
.sth .grip{position:absolute;right:0;top:0;padding:2px 6px;font-size:.85rem;background:rgba(255,255,255,.85);color:#555;border-radius:0 5px 0 5px}
#list.doc li{scroll-margin-top:80px}
.box{position:relative}
.wo{position:absolute;inset:0;pointer-events:none}
.wr{position:absolute;background:#fff}
body.wom .wr{outline:1.5px dashed var(--accent)}
.wr b{display:none;position:absolute;top:0;right:0;width:20px;height:20px;align-items:center;justify-content:center;background:var(--yellow);color:#1d1d1b;font-size:.9rem;line-height:1;cursor:pointer;pointer-events:auto}
body.wom .wr b{display:flex}
.wr.pv{background:rgba(255,255,255,.7)}
body.wom #list.doc .box{touch-action:none;cursor:crosshair;user-select:none}
.btn.on{background:var(--yellow)!important;color:#1d1d1b!important;border-color:var(--yellow)!important}
@media (max-width:720px){#work.docmode{grid-template-columns:104px minmax(0,1fr);gap:10px}.sth .grip{padding:1px 4px;font-size:.75rem}}

#markp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0 0}
#markp .btn,#markp select{padding:7px 13px;font-size:.78rem}
#markp input{font:inherit;font-size:.78rem;padding:7px 8px;width:64px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text)}
#sw,#mtx{display:flex;gap:6px;align-items:center}
.swb{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);padding:0;cursor:pointer}
.swb.on{outline:2px solid var(--text);outline-offset:1px}
#mmsg{font-size:.8rem;color:var(--muted)}
#list.doc .box{container-type:inline-size}
body.anm #list.doc .box{touch-action:none;cursor:crosshair;user-select:none}
.an{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.an *{pointer-events:none}
.ai{position:absolute}
.ai .mrk{position:absolute;left:0;right:0;background:var(--c)}
.ai.hl .mrk{top:0;bottom:0;opacity:.4;mix-blend-mode:multiply}
.ai.ul .mrk{bottom:0;height:2px}
.ai.st .mrk{top:50%;height:2px}
.ai.pv{background:rgba(255,225,77,.4);outline:1px dashed var(--accent)}
.ai.f{inset:0}
.ansv{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ai b,.ai .mv,.ai .rs{display:none;position:absolute;width:20px;height:20px;align-items:center;justify-content:center;background:var(--yellow);color:#1d1d1b;font-size:.85rem;line-height:1;font-style:normal;font-weight:800;border-radius:4px;z-index:3;box-sizing:border-box}
.ai b{top:0;right:0;cursor:pointer}
.ai.f b{right:auto;transform:translate(-100%,0)}
.ai .mv{left:0;top:0;cursor:move}
.ai .rs{right:0;bottom:0;cursor:ew-resize;opacity:.8}
.ai.t textarea{display:block;width:100%;box-sizing:border-box;border:0;outline:0;background:transparent;resize:none;overflow:hidden;padding:0;margin:0;line-height:1.2;font-family:inherit;user-select:text;cursor:text}
.ai.t:hover textarea,.ai.t.sel textarea{outline:1px dashed var(--accent)}
.ai.cm textarea{background:#fff7b0;border:1px solid #c9b037;padding:.35em}
.ai.n{width:0;height:0}
.ai.n .ic{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:3.6cqw;height:3.6cqw;background:#ffd633;border:1px solid #a07d00;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ai.n .np{display:none;position:absolute;left:2.4cqw;top:-2cqw;width:26cqw;background:#fff7b0;border:1px solid #c9b037;border-radius:4px;padding:4px;z-index:4;box-sizing:border-box}
.ai.n.open .np{display:block}
.ai.n.fl .np{left:auto;right:2.4cqw}
.ai.n textarea{display:block;width:100%;min-height:5em;box-sizing:border-box;border:0;background:transparent;resize:vertical;outline:0;font:inherit;font-size:max(2.2cqw,12px);color:#1d1d1b;padding:0 18px 0 0}
body.anm .ai b,body.anm .ai .mv,body.anm .ai .rs,body.anm .ai.t textarea,body.anm .ai.n .ic,body.anm .ai.n textarea{pointer-events:auto}
body.anm .ai.r b,body.anm .ai.f b,body.anm .ai.n.open .np b,body.anm .ai.t:hover b,body.anm .ai.t:hover .mv,body.anm .ai.t:hover .rs,body.anm .ai.t.sel b,body.anm .ai.t.sel .mv,body.anm .ai.t.sel .rs{display:flex}
body.anm .ai.n .ic{cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bar"><div class="brand"><a class="logo" href="#editor"><span class="lp">p</span>df-ep.</a></div>
    <div id="tools" hidden>
      <button class="go" id="go" disabled>Download PDF</button>
      <span class="sep"></span>
      <div id="tmid">
        <button class="btn" id="splitbtn">Custom split</button>
        <button class="btn" id="wordbtn">Word</button>
        <button class="btn" id="viewmode">Document view</button>
        <button class="btn" id="mkbtn">Markup</button>
        <button class="btn" id="wobtn">Whiteout</button>
        <span class="sep" id="sep2" hidden></span>
        <select id="size" hidden><option value="fit">Paper: original (blank = A4)</option><option value="a4">Paper: A4</option><option value="letter">Paper: Letter 8.5 × 11 in</option><option value="long">Paper: Legal 8.5 × 13 in</option><option value="a3">Paper: A3</option><option value="a5">Paper: A5</option></select>
        <select id="place" hidden><option value="mc">Place: Center</option><option value="tl">Top left</option><option value="tc">Top center</option><option value="tr">Top right</option><option value="ml">Middle left</option><option value="mr">Middle right</option><option value="bl">Bottom left</option><option value="bc">Bottom center</option><option value="br">Bottom right</option></select>
      </div>
    </div>
    <div class="right"><button class="btn" id="newbtn" hidden title="New (Ctrl+N or Alt+N), then Ctrl+D or Alt+D to discard">New</button><nav><a href="#editor" data-v="editor">HOME</a><a href="#about" data-v="about">ABOUT US</a></nav></div></div>
    <div id="wordp" hidden><select id="wmode"><option value="text">Editable text</option><option value="hybrid">Look-alike (keeps page layout)</option><option value="img">Pages as images</option></select><input id="wranges" placeholder="All pages, or 1-2, 5" autocomplete="off"><button class="go" id="wordgo">Download Word</button><span id="wmsg"></span></div>
    <div id="split" hidden><input id="ranges" placeholder="1-2, 3, 4, 5-6" autocomplete="off"><button class="go" id="splitgo">Download split PDFs</button><span id="smsg"></span></div>
    <div id="markp" hidden><button class="btn on" data-t="hl">Highlight</button><button class="btn" data-t="ul">Underline</button><button class="btn" data-t="st">Strikethrough</button><button class="btn" data-t="free">Draw</button><button class="btn" data-t="txt">Text</button><button class="btn" data-t="cmt">Comment</button><button class="btn" data-t="note">Sticky note</button><span class="sep"></span><span id="sw"></span><span id="mtx" hidden><select id="mfont"><option value="sans">Sans</option><option value="serif">Serif</option><option value="mono">Mono</option></select><input id="msize" type="number" min="6" max="144" value="14" title="Size (pt)"><button class="btn" id="mb"><b>B</b></button><button class="btn" id="mi"><i>I</i></button></span><button class="btn" id="mundo">Undo</button></div>
  </header>
  <div id="libwarn" role="alert" hidden><span id="libtxt"></span><button class="btn" id="libreload">Reload</button></div>

async function rotate(p){

// FLIP: remember where every card was, run the reorder, then slide each card from its old spot to its new one
function flip(el,skip,fn){
  const kids=[...el.children],first=new Map(kids.map(k=>[k,k.getBoundingClientRect()]));
  fn();
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  kids.forEach(k=>{
    if(k===skip)return;
    const a=first.get(k),b=k.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;
    if(dx||dy)k.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
}
function sortable(el){

  });

    if(!drag)return;
    if(el===$('side')){const r=el.getBoundingClientRect();if(e.clientY<r.top+30)el.scrollTop-=12;else if(e.clientY>r.bottom-30)el.scrollTop+=12}
    else if(list.classList.contains('doc')){if(e.clientY<110)scrollBy(0,-14);else if(e.clientY>innerHeight-60)scrollBy(0,14)}
    const over=[...el.children].find(x=>{
      if(x===drag||!x._p)return false;
      const r=x.getBoundingClientRect();
      return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
    });
    if(!over)return;
    const now=performance.now();if(now-last<130)return;last=now;
    const r=over.getBoundingClientRect();
    const ref=e.clientX>r.left+r.width/2?over.nextSibling:over;
    if(ref===drag||ref===drag.nextSibling)return;
    flip(el,drag,()=>el.insertBefore(drag,ref));

  const end=()=>{
    if(!drag)return;
    const order=[...el.children].filter(x=>x._p).map(x=>x._p);
    pages.splice(0,pages.length,...order);
    drag=null;render();
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
}

// paint white boxes over the marked areas (cover only: the original content stays in the file)
function whiteRects(pg,p){
  const R=((pg.getRotation().angle%360)+360)%360;
  let b;try{b=pg.getCropBox()}catch(e){b=pg.getMediaBox()}
  const m=(u,v)=>R===90?[v,1-u]:R===180?[1-u,1-v]:R===270?[1-v,u]:[u,v];
  for(const r of p.wo){
    const A=m(r.x,r.y),B=m(r.x+r.w,r.y+r.h);
    const a0=Math.min(A[0],B[0]),a1=Math.max(A[0],B[0]),b0=Math.min(A[1],B[1]),b1=Math.max(A[1],B[1]);
    pg.drawRectangle({x:b.x+a0*b.width,y:b.y+b.height-b1*b.height,width:(a1-a0)*b.width,height:(b1-b0)*b.height,color:PDFLib.rgb(1,1,1),borderWidth:0});
  }
}
async function flatImg(p){

  c.width=img.naturalWidth;c.height=img.naturalHeight;
  const x=c.getContext('2d');x.drawImage(img,0,0);x.fillStyle='#fff';
  for(const r of p.wo)x.fillRect(r.x*c.width,r.y*c.height,r.w*c.width,r.h*c.height);

async function build(list=pages,prog){
  const {PDFDocument,degrees}=PDFLib;

  const SIZES={a4:[595.28,841.89],a3:[841.89,1190.55],a5:[419.53,595.28],letter:[612,792],long:[612,936]};
  const fmt=SIZES[sz]||SIZES.a4,fc={};let done=0,last=performance.now();
  for(const p of list){
    if(p.kind==='pdf'){
      const [pg]=await out.copyPages(p.src.doc,[p.idx]);
      if(p.rot)pg.setRotation(degrees((pg.getRotation().angle+p.rot)%360));
      out.addPage(pg);
      if(p.wo&&p.wo.length)whiteRects(pg,p);
      if(sz!=='fit'){
        // resize: draw the finished page onto a new sheet of the chosen size (landscape pages get a landscape sheet), then drop the original
        const R=((pg.getRotation().angle%360)+360)%360;
        let b;try{b=pg.getCropBox()}catch(e){b=pg.getMediaBox()}
        const emb=await out.embedPage(pg,{left:b.x,bottom:b.y,right:b.x+b.width,top:b.y+b.height});
        out.removePage(out.getPageCount()-1);
        const turn=R===90||R===270,dw=turn?b.height:b.width,dh=turn?b.width:b.height;
        const [fw,fh]=fmt,[pw,ph]=dw>dh?[fh,fw]:[fw,fh];
        const s=Math.min(pw/dw,ph/dh),w=dw*s,h=dh*s,uw=b.width*s,uh=b.height*s;
        const x0=pl[1]==='l'?0:pl[1]==='r'?pw-w:(pw-w)/2;
        const y0=pl[0]==='t'?ph-h:pl[0]==='b'?0:(ph-h)/2;
        const ox=R===180?uw:R===270?uh:0,oy=R===90?uw:R===180?uh:0;
        const np=out.addPage([pw,ph]);np.drawPage(emb,{x:x0+ox,y:y0+oy,width:uw,height:uh,rotate:degrees(-R)});
        await drawAnn(out,np,p,{P:(u,v)=>[x0+u*w,y0+h-v*h],W:w,H:h,tr:0},fc);
      }else if(p.an&&p.an.length){
        const R=((pg.getRotation().angle%360)+360)%360;let b;try{b=pg.getCropBox()}catch(e){b=pg.getMediaBox()}
        const m=(u,v)=>R===90?[v,1-u]:R===180?[1-u,1-v]:R===270?[1-v,u]:[u,v],turn=R===90||R===270;
        await drawAnn(out,pg,p,{P:(u,v)=>{const q=m(u,v);return [b.x+q[0]*b.width,b.y+b.height-q[1]*b.height]},W:turn?b.height:b.width,H:turn?b.width:b.height,tr:R},fc);
      }
    }else if(p.kind==='blank'){
      const bp=out.addPage(fmt);await drawAnn(out,bp,p,{P:(u,v)=>[u*fmt[0],fmt[1]-v*fmt[1]],W:fmt[0],H:fmt[1],tr:0},fc);
    }else{
      const im=await out.embedJpg(await flatImg(p));
      if(sz==='fit'){
        const ip=out.addPage([p.w,p.h]);ip.drawImage(im,{x:0,y:0,width:p.w,height:p.h});
        await drawAnn(out,ip,p,{P:(u,v)=>[u*p.w,p.h-v*p.h],W:p.w,H:p.h,tr:0},fc);
      }else{
        const [pw,ph]=fmt,m=24,s=Math.min((pw-2*m)/p.w,(ph-2*m)/p.h),w=p.w*s,h=p.h*s;
        const x=pl[1]==='l'?m:pl[1]==='r'?pw-m-w:(pw-w)/2;
        const yt=pl[0]==='t'?m:pl[0]==='b'?ph-m-h:(ph-h)/2;
        const ip=out.addPage([pw,ph]);ip.drawImage(im,{x,y:ph-yt-h,width:w,height:h});
        await drawAnn(out,ip,p,{P:(u,v)=>[x+u*w,ph-yt-v*h],W:w,H:h,tr:0},fc);
      }
    }
    if(prog){prog(++done,list.length);if(performance.now()-last>60){await new Promise(r=>setTimeout(r));last=performance.now()}}
  }
  return out.save();
}

function parseRanges(txt,n){
  const out=[];
  for(const t of txt.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean)){
    const m=t.match(/^(\d+)(?:\s*[-–]\s*(\d+))?$/);
    if(!m)return 'Can’t read “'+t+'”. Try 1-2, 3.';
    const a=+m[1],b=m[2]?+m[2]:a;
    if(a<1||b>n||a>b)return '“'+t+'” is outside pages 1–'+n+'.';
    out.push({idx:Array.from({length:b-a+1},(_,i)=>a-1+i),label:a===b?''+a:a+'-'+b});
  }
  return out.length?out:'Enter ranges like 1-2, 3, 4, 5-6.';
}

// New: the header circle grows over the pages, then settles back into the home circle (the reverse of flyTo)
let flying=false;
function flyBack(reset){
  const lp=document.querySelector('.lp'),r=lp.getBoundingClientRect();
  const fs=parseFloat(getComputedStyle(lp).fontSize),sz=fs*1.7;
  const cx=r.left+r.width/2-fs*.45,cy=r.top+r.height/2,k=2*Math.hypot(innerWidth,innerHeight)/sz;
  const T=(x,y,q)=>'translate('+(x-sz/2)+'px,'+(y-sz/2)+'px) scale('+q+')';
  const c=document.createElement('div');
  c.style.cssText='position:fixed;left:0;top:0;margin:0;z-index:30;pointer-events:none;border-radius:50%;background:var(--yellow);width:'+sz+'px;height:'+sz+'px';
  document.body.appendChild(c);flying=true;
  const grow=c.animate([{transform:T(cx,cy,1)},{transform:T(cx,cy,k)}],{duration:520,easing:'cubic-bezier(.5,0,.75,.4)',fill:'forwards'});
  const phase2=()=>{
    reset();scrollTo(0,0);
    const d=drop.getBoundingClientRect();
    const settle=c.animate([{transform:T(cx,cy,k)},{transform:T(d.left+d.width/2,d.top+d.height/2,d.width/sz)}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
    $('big').animate([{transform:'translateX(60vw)',opacity:0},{transform:'none',opacity:1}],{duration:700,delay:260,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'});
    // the home circle already sits under the traveling one, so removing the clone causes no flash; only its text fades in, as a separate step
    const end=()=>{

      c.remove();flying=false;
    };
    settle.onfinish=end;settle.oncancel=end;
  };
  grow.onfinish=phase2;grow.oncancel=phase2;
}

// parts: [{type:'hybrid',W,H,url,lines} | {type:'text',W,H,paras,m} | {type:'img',W,H,url} | {type:'blank',W,H}], one Word section (page size) each
function makeDocx(parts){

    const last=i===parts.length-1;
    const m=pt.type==='text'?pt.m:(pt.type==='img'||pt.type==='hybrid')?{l:0,r:0,t:0,b:0}:{l:72,r:72,t:72,b:72};
    const sect=wSect(pt.W,pt.H,m);
    const tail=last?'':sect;
    if(pt.type==='hybrid'){
      img++;const rid='rId'+(img+1),name='image'+img+'.jpg';
      zip.file('word/media/'+name,wBytes(pt.url));
      rels.push('<Relationship Id="'+rid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/'+name+'"/>');
      (pt.tables||[]).forEach(g=>{body+=wTable(g)+'<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/></w:pPr></w:p>'});
      pt.lines.forEach(l=>{body+=wFrame(l,pt.W,pt.hide)});
      body+=wImgBack(rid,img,pt.W,pt.H,tail);
    }else if(pt.type==='img'){
      img++;const rid='rId'+(img+1),name='image'+img+'.jpg';
      zip.file('word/media/'+name,wBytes(pt.url));
      rels.push('<Relationship Id="'+rid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/'+name+'"/>');
      body+=wImg(rid,img,pt.W*.985,pt.H*.985,tail);
    }else{
      const ps=pt.type==='text'&&pt.paras.length?pt.paras:[{text:'',half:22}];
      ps.forEach((p,k)=>{body+=wPara(p,k===ps.length-1?tail:'')});
    }
    if(last)body+=sect;
  });
  const W='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture" xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006" xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml" mc:Ignorable="w14"';
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  zip.file('[Content_Types].xml',X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>');
  zip.file('_rels/.rels',X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/_rels/document.xml.rels',X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+rels.join('')+'</Relationships>');
  zip.file('word/styles.xml',X+'<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="en-US"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>');
  zip.file('word/document.xml',X+'<w:document '+W+'><w:body>'+body+'</w:body></w:document>');
  return zip;
}

// does this PDF page have a real text layer? (scanned pages do not)
async function pdfHasText(p){
  if(p.kind!=='pdf'||!p.src.pj)return false;
  if(p.hasText!==undefined)return p.hasText;
  try{
    const tc=await (await p.src.pj.getPage(p.idx+1)).getTextContent();
    let n=0;for(const it of tc.items)n+=(it.str||'').replace(/\s/g,'').length;
    p.hasText=n>=8;
  }catch(e){p.hasText=false}
  return p.hasText;
}
async function pageItems(p){

    try{const f=pg.commonObjs.has(n)?pg.commonObjs.get(n):null;
      if(f){const nm=String(f.name||f.fallbackName||'');r.b=!!f.bold||/bold|black|heavy|demi/i.test(nm);r.i=!!f.italic||/italic|oblique/i.test(nm)}}catch(e){}

async function pageText(p){

// text lines with exact positions (top-down, pt), for the look-alike mode; wide gaps start a new line box

    const vc=(i,j)=>c.v.some(v=>near(v.x,xs[i])&&v.a<=ys[j]+2.5&&v.b>=ys[j+1]-2.5);

    for(let r=0;r<NR;r++)for(let q=0;q<NC;q++){
      if(own[r][q]>=0)continue;

      for(;r+rs<NR;rs++){let open=true;for(let k=0;k<cs;k++)if(hc(r+rs,q+k)||own[r+rs][q+k]>=0)open=false;if(!open)break}
      const all=(f,m)=>{for(let k=0;k<m;k++)if(!f(k))return false;return true};
      const cell={r,q,rs,cs,x0:xs[q],x1:xs[q+cs],y0:ys[r],y1:ys[r+rs],lines:[],
        bt:all(k=>hc(r,q+k),cs),bb:all(k=>hc(r+rs,q+k),cs),bl:all(k=>vc(q,r+k),rs),br:all(k=>vc(q+cs,r+k),rs)};

// puts each text line into its cell; grids with no text are left alone (decoration stays in the picture)
function rebuildTables(R,lines){
  let rest=lines.slice();const tables=[];
  for(const g of findGrids(R)){
    const keep=[];let n=0;
    for(const l of rest){
      const cx=l.x+l.w/2,cy=l.y-l.fs*.3;
      const r=g.ys.findIndex((y,i)=>i<g.NR&&cy>=y-1&&cy<g.ys[i+1]+1),c=g.xs.findIndex((x,i)=>i<g.NC&&cx>=x-1&&cx<g.xs[i+1]+1);
      if(r<0||c<0){keep.push(l);continue}
      g.cells[g.own[r][c]].lines.push(l);n++;
    }
    if(!n){g.cells.forEach(c=>c.lines.length=0);continue}
    rest=keep;tables.push(g);

async function pageRules(p,k){
  const pg=await p.src.pj.getPage(p.idx+1),rotation=(((pg.rotate||0)+p.rot)%360+360)%360,vp=pg.getViewport({scale:1,rotation});
  const ol=await pg.getOperatorList(),R=pdfRules(ol.fnArray,ol.argsArray,pdfjsLib.OPS,(x,y)=>vp.convertToViewportPoint(x,y));
  return {H:R.H.map(s=>({y:s.y*k,a:s.a*k,b:s.b*k})),V:R.V.map(s=>({x:s.x*k,a:s.a*k,b:s.b*k}))};

// paint a table's ruled lines out of the text-free picture (the Word table draws them instead)
function eraseRules(cv,sc,g){
  const x=cv.getContext('2d'),lum=d=>.3*d[0]+.59*d[1]+.11*d[2];
  const px=(a,b)=>x.getImageData(Math.max(0,Math.min(cv.width-1,Math.round(a))),Math.max(0,Math.min(cv.height-1,Math.round(b))),1,1).data;
  const fill=(a,b,w,h,d)=>{x.fillStyle=(lum(d[0])>235||lum(d[1])>235)?'#fff':'rgb('+d[0][0]+','+d[0][1]+','+d[0][2]+')';x.fillRect(a,b,w,h)};
  const T=3;
  for(const h of g.h){const y=h.y*sc,m=(h.a+h.b)/2*sc;fill(h.a*sc-1,y-T,(h.b-h.a)*sc+2,2*T,[px(m,y-T-2),px(m,y+T+2)])}

}
// look-alike page: the page picture (text taken out) behind, the real text on top in its own spot, color and font family
const hFamily=ff=>/mono/i.test(ff)?'Courier New':/serif/i.test(ff)&&!/sans/i.test(ff)?'Times New Roman':'Arial';
async function pageHybrid(p){
  const full=await pageJpeg(p),t=await pageItems(p),k=full.W/t.W;
  let rules=null;try{rules=await pageRules(p,k)}catch(e){}
  const lines=hLines(t.items,k,rules?rules.V.map(v=>v.x):null);
  let bare=null;
  try{bare=await pageJpeg(p,true)}catch(e){}
  const mc=document.createElement('canvas').getContext('2d');
  let hit=0;
  if(bare&&bare.cv&&full.cv){
    const sc=full.cv.width/full.W,fx=full.cv.getContext('2d'),bx=bare.cv.getContext('2d');
    for(const l of lines){
      const x0=Math.max(0,Math.floor(l.x*sc)),y0=Math.max(0,Math.floor((l.y-l.fs*.85)*sc));
      const w=Math.min(full.cv.width-x0,Math.ceil(l.w*sc)),h=Math.min(full.cv.height-y0,Math.ceil(l.fs*1.1*sc));
      if(w<1||h<1)continue;
      const A=fx.getImageData(x0,y0,w,h).data,B=bx.getImageData(x0,y0,w,h).data;
      let best=0,bi=-1;
      for(let i=0;i<A.length;i+=4){const d=Math.abs(A[i]-B[i])+Math.abs(A[i+1]-B[i+1])+Math.abs(A[i+2]-B[i+2]);if(d>best){best=d;bi=i}}
      if(best>90){hit++;l.color=[A[bi],A[bi+1],A[bi+2]].map(v=>v.toString(16).padStart(2,'0')).join('')}
    }
  }
  // text really removed from the picture: show real text. Otherwise keep the full picture and hide the text on top.
  const clean=lines.length&&hit/lines.length>=.6;
  for(const l of lines){
    l.font=hFamily(l.ff);
    let mw=0;
    for(const q of l.runs){mc.font=(q.i?'italic ':'')+(q.b?'bold ':'')+l.fs+'px "'+l.font+'"';mw+=mc.measureText(q.t).width}
    const n=[...l.text].length,sp=n>1?Math.round((l.w-mw)/(n-1)*20):0;
    l.sp=wClamp(sp,-60,60);
  }
  // ruled grids become real Word tables; their lines are painted out of the picture
  let tables=[],rest=lines,url=clean?bare.url:full.url;
  if(clean&&rules){
    try{
      const r=rebuildTables(rules,lines);
      if(r.tables.length){
        const sc=bare.cv.width/full.W,fx=full.cv.getContext('2d');
        for(const g of r.tables){
          const h0=g.h[0],d=h0?fx.getImageData(Math.round((h0.a+h0.b)/2*sc),Math.round(h0.y*sc),1,1).data:[0,0,0];
          g.color=(.3*d[0]+.59*d[1]+.11*d[2])<200?[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join(''):'000000';
          eraseRules(bare.cv,sc,g);

        url=bare.cv.toDataURL('image/jpeg',.9);tables=r.tables;rest=r.rest;
      }
    }catch(e){tables=[];rest=lines;url=bare.url}
  }
  return {type:'hybrid',url,W:full.W,H:full.H,lines:rest,tables,hide:!clean};
}
// one page as a picture (rotation and whiteout boxes included)
async function pageJpeg(p,noText){
  let url,W,H,cv;
  if(p.kind==='pdf'){
    const pg=await p.src.pj.getPage(p.idx+1);
    const rotation=(((pg.rotate||0)+p.rot)%360+360)%360;
    const v=pg.getViewport({scale:1,rotation}),vp=pg.getViewport({scale:1400/v.width,rotation});
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    if(noText){x.fillText=()=>{};x.strokeText=()=>{}} // pdf.js draws page text with these two calls
    await pg.render({canvasContext:x,viewport:vp}).promise;
    x.fillStyle='#fff';for(const r of p.wo||[])x.fillRect(r.x*c.width,r.y*c.height,r.w*c.width,r.h*c.height);
    url=c.toDataURL('image/jpeg',.9);cv=c;W=v.width;H=v.height;
    const k=Math.min(1,1500/Math.max(W,H));W*=k;H*=k;
  }else{
    url=await flatImg(p);
    const k=842/Math.max(p.w,p.h);W=p.w*k;H=p.h*k;
  }
  return {type:'img',url,W,H,cv};
}
async function convertWord(mode,idxList,progress){
  const parts=[];let n=0;
  for(const k of idxList){
    const p=pages[k];progress(++n,idxList.length);
    if(p.kind==='blank'){parts.push({type:'blank',W:595.28,H:841.89});continue}
    if(mode==='text'&&await pdfHasText(p)){parts.push({type:'text',...await pageText(p)});continue}
    if(mode==='hybrid'&&await pdfHasText(p)){parts.push(await pageHybrid(p));continue}
    if(p.kind==='pdf'&&!p.src.pj)throw new Error('Page '+(k+1)+' can’t be drawn in this browser.');
    parts.push(await pageJpeg(p));
    await new Promise(r=>setTimeout(r));
  }
  return makeDocx(parts);
}

// Home <-> About: the old headline lines slide up and away while the figure sinks (or the + fades), then the new lines slide up and the figure rises; the circle holds still and gives a small pulse
let navAnims=[],navBusy=false;
function navGo(){
  const toAbout=location.hash==='#about';
  if(navBusy){navAnims.forEach(a=>a.cancel());navAnims=[];navBusy=false;showView();return}
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,wasAbout=document.body.classList.contains('abt'),heroOn=!$('hero').hidden;
  if(reduce||flying||wasAbout===toAbout){showView();return}

  navBusy=true;
  const lines=[...$('big').children].filter(x=>!x.hidden),outs=[];
  lines.forEach((l,i)=>outs.push(l.animate([{transform:'none',opacity:1},{transform:'translateY(-45%)',opacity:0}],{duration:260,delay:i*70,easing:'cubic-bezier(.5,0,.75,.4)',fill:'forwards'})));

  else outs.push($('add').animate([{opacity:1},{opacity:0}],{duration:240,fill:'forwards'}));

    }else navIn();
  });
}
function navIn(){
